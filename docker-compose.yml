services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:?defina DB_NAME no arquivo .env}
      MYSQL_USER: ${DB_USER:?defina DB_USER no arquivo .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no arquivo .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root --password="$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  agente:
    build: ./backend
    container_name: agente
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma3:4b}
      - JAEGER_ENDPOINT=http://jaeger:4317
      - DB_HOST=mysql
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:?defina DB_NAME no arquivo .env}
      - DB_USER=${DB_USER:?defina DB_USER no arquivo .env}
      - DB_PASSWORD=${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-24}
      - OVERPASS_URL=${OVERPASS_URL:-https://overpass-api.de/api/interpreter}
      - OVERPASS_FALLBACK_URL=${OVERPASS_FALLBACK_URL-https://overpass.private.coffee/api/interpreter}
      - NEIGHBORHOOD_CENTER_LAT=${NEIGHBORHOOD_CENTER_LAT:--26.4700649}
      - NEIGHBORHOOD_CENTER_LON=${NEIGHBORHOOD_CENTER_LON:--49.1264936}
      - NEIGHBORHOOD_SEARCH_RADIUS_METERS=${NEIGHBORHOOD_SEARCH_RADIUS_METERS:-1800}
      - PLACE_SEARCH_TIMEOUT_SECONDS=${PLACE_SEARCH_TIMEOUT_SECONDS:-15}
      - PLACE_SEARCH_TOTAL_TIMEOUT_SECONDS=${PLACE_SEARCH_TOTAL_TIMEOUT_SECONDS:-18}
      - PLACE_SEARCH_CACHE_TTL_SECONDS=${PLACE_SEARCH_CACHE_TTL_SECONDS:-600}
      - PLACE_SEARCH_MAX_RESULTS=${PLACE_SEARCH_MAX_RESULTS:-5}
      - WEATHER_TIMEOUT_SECONDS=${WEATHER_TIMEOUT_SECONDS:-8}
      - WEATHER_CACHE_TTL_SECONDS=${WEATHER_CACHE_TTL_SECONDS:-600}
    volumes:
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      jaeger:
        condition: service_started
      loki:
        condition: service_started
    restart: unless-stopped


  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3001:80"
    depends_on:
      - agente
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/config.yml
      - ./logs:/logs
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:
