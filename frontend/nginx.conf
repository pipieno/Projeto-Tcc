server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /chat {
        proxy_pass http://agente:8080;
        proxy_set_header Host $host;
    }

    location /sessions {
        proxy_pass http://agente:8080;
        proxy_set_header Host $host;
    }

    location /export {
        proxy_pass http://agente:8080;
        proxy_set_header Host $host;
    }
}
